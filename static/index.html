<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M3P Aero</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #14181e;
      --ink: #e8edf4;
      --muted: #8b97a8;
      --line: #2a3340;
      --accent: #e31937;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 14px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
    header {
      display: flex; align-items: baseline; gap: 16px;
      padding: 12px 20px 8px; border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
    header span { color: var(--muted); font-size: 12px; }
    main { display: grid; grid-template-columns: 260px 1fr; height: calc(100% - 46px); }
    aside { padding: 12px 16px 16px; border-right: 1px solid var(--line); overflow: auto; }
    label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.08em; }
    input[type=range] { width: 100%; }
    .val { float: right; color: var(--ink); font-variant-numeric: tabular-nums; }
    button {
      width: 100%; margin-top: 14px; padding: 10px;
      background: var(--accent); color: white; border: 0; border-radius: 6px;
      font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .num { background: var(--panel); padding: 7px 10px; border-radius: 6px; }
    .num b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
    .num span { color: var(--muted); font-size: 11px; }
    .warn { margin-top: 12px; color: var(--muted); font-size: 11px; }
    canvas { width: 100%; height: 100%; display: block; background: #12161c; }
    .err { color: var(--accent); white-space: pre-wrap; font-size: 12px; }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto minmax(240px, 1fr);
        height: auto; min-height: calc(100% - 46px); }
      aside { border-right: none; border-bottom: 1px solid var(--line); }
      canvas { min-height: 240px; height: 50vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>M3P 2D aero</h1>
    <span>Highland silhouette · live smoke · street-aero estimates, not Tesla CFD</span>
  </header>
  <main>
    <aside>
      <label>Airspeed <span class="val" id="vAirspeedMps">30 m/s</span></label>
      <input id="airspeedMps" type="range" min="0" max="80" step="1" value="30" />
      <label>Ride height <span class="val" id="vRideHeightMm">128 mm</span></label>
      <input id="rideHeightMm" type="range" min="80" max="160" step="1" value="128" />
      <label>Splitter <span class="val" id="vSplitter">0 mm</span></label>
      <input id="splitter" type="range" min="0" max="120" step="1" value="0" />
      <label>Rear wing <span class="val" id="vRearWing">0 mm</span></label>
      <input id="rearWing" type="range" min="0" max="280" step="1" value="0" />
      <label>Diffuser <span class="val" id="vDiffuser">0 mm</span></label>
      <input id="diffuser" type="range" min="0" max="200" step="1" value="0" />
      <button id="go">Simulate</button>
      <div class="nums">
        <div class="num"><span>Cd</span><b id="cd">—</b></div>
        <div class="num"><span>Cl (SAE)</span><b id="cl">—</b></div>
        <div class="num"><span>Drag</span><b id="dragN">—</b></div>
        <div class="num"><span>Downforce</span><b id="downforceN">—</b></div>
        <div class="num"><span>Front axle</span><b id="frontN">—</b></div>
        <div class="num"><span>Rear axle</span><b id="rearN">—</b></div>
        <div class="num"><span>Balance % front</span><b id="balancePct">—</b></div>
        <div class="num"><span>ms</span><b id="ms">—</b></div>
      </div>
      <p class="warn">x aft-positive, y up, y=0 ground. Forces from ChainBear
        street-aero polar (SAE Cl: negative = downforce). Flow is pictorial.
        Not 3D CFD.</p>
      <p class="err" id="err"></p>
    </aside>
    <canvas id="c"></canvas>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const fields = ["airspeedMps", "rideHeightMm", "splitter", "rearWing", "diffuser"];
    const units = { airspeedMps: " m/s", rideHeightMm: " mm", splitter: " mm", rearWing: " mm", diffuser: " mm" };
    fields.forEach((id) => {
      $(id).addEventListener("input", () => {
        $("v" + id.charAt(0).toUpperCase() + id.slice(1)).textContent = $(id).value + units[id];
        scheduleSim();
      });
    });

    const canvas = $("c");
    const ctx = canvas.getContext("2d");
    const BG = "#12161c";

    // Tall bluff fascia, short hood, cab-forward glass, liftback, ducktail.
    const UPPER = [
      [0.00, 0.16], [0.00, 0.58], [0.06, 0.64], [0.16, 0.66],
      [0.40, 0.66], [0.70, 0.67], [1.00, 0.70],
      [1.16, 0.88], [1.32, 1.12], [1.52, 1.30], [1.75, 1.40],
      [2.05, 1.428], [2.45, 1.431], [2.85, 1.425], [3.15, 1.395],
      [3.42, 1.28], [3.68, 1.12], [3.95, 1.00], [4.20, 0.95],
      [4.38, 0.93], [4.50, 0.96], [4.56, 1.05], [4.64, 0.98],
      [4.70, 0.76], [4.724, 0.40], [4.68, 0.22], [4.48, 0.16],
    ];
    const STOCK_H = 0.128;
    const WHEEL_R = 0.325;
    const WELL_R = 0.368;
    const AXLES = [0.85, 3.72];
    const N_PARTICLES = 220;
    const TRAIL = 22;

    function resize() {
      const r = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, r.width * devicePixelRatio);
      canvas.height = Math.max(1, r.height * devicePixelRatio);
    }
    window.addEventListener("resize", resize);
    resize();

    let last = null;
    let particles = [];
    let simTimer = null;

    function currentSetup() {
      return {
        h: Number($("rideHeightMm").value) / 1000,
        splitterM: Number($("splitter").value) / 1000,
        wingM: Number($("rearWing").value) / 1000,
        diffuserM: Number($("diffuser").value) / 1000,
      };
    }

    function upperBody(h) {
      const dy = h - STOCK_H;
      return UPPER.map(([x, y]) => [x, y + dy]);
    }

    function closedBody(h, splitterM, wingM, diffuserM) {
      const upper = upperBody(h);
      const pts = upper.slice();
      if (wingM > 0.004) {
        const duck = upper[21];
        const xLe = duck[0] - 0.05;
        const y0 = duck[1] + 0.04;
        pts.push([xLe, y0], [xLe + 0.05, y0 + 0.028], [xLe + wingM, y0 + 0.04],
                 [xLe + wingM, y0 + 0.01], [xLe, y0]);
      }
      const rise = Math.min(diffuserM * 0.9, 0.22);
      const tail = upper[upper.length - 1];
      pts.push([4.724, h + rise]);
      if (diffuserM > 0.001) pts.push([4.724 - 1.05, h]);
      if (splitterM > 0.001) {
        pts.push([0.10, h]);
        pts.push([-splitterM, h - 0.01]);
        pts.push([-splitterM, h - 0.024]);
        pts.push([0.00, upper[0][1]]);
      } else {
        pts.push([0.10, h]);
        pts.push([0.00, h]);
        pts.push([0.00, upper[0][1]]);
      }
      return pts;
    }

    function glassPoly(h) {
      const dy = h - STOCK_H;
      return [
        [1.20, 0.86 + dy], [1.36, 1.10 + dy], [1.55, 1.28 + dy], [1.78, 1.385 + dy],
        [2.10, 1.412 + dy], [2.50, 1.412 + dy], [2.90, 1.405 + dy], [3.18, 1.37 + dy],
        [3.45, 1.24 + dy], [3.62, 1.12 + dy], [3.48, 1.04 + dy], [2.60, 1.16 + dy],
        [1.90, 1.16 + dy], [1.32, 0.82 + dy],
      ];
    }

    function worldToScreen() {
      const split = currentSetup().splitterM;
      const x0 = -0.45 - split, x1 = 5.15, y0 = -0.05, y1 = 1.78;
      const pad = 28 * devicePixelRatio;
      const w = canvas.width - 2 * pad, hh = canvas.height - 2 * pad;
      const sc = Math.min(w / (x1 - x0), hh / (y1 - y0));
      const ox = pad + (w - sc * (x1 - x0)) / 2;
      const oy = pad + (hh - sc * (y1 - y0)) / 2;
      return (x, y) => [ox + (x - x0) * sc, canvas.height - (oy + (y - y0) * sc)];
    }

    function sampleVel(flow, meta, x, y) {
      const x0 = (meta && meta.x0 != null) ? meta.x0 : -1.80;
      const y0 = (meta && meta.y0 != null) ? meta.y0 : 0.04;
      const nx = flow.nx, ny = flow.ny;
      const fx = (x - x0) / flow.dx, fy = (y - y0) / flow.dy;
      if (fx < 0 || fy < 0 || fx > nx - 1 || fy > ny - 1) return [0, 0];
      const i = Math.floor(fx), j = Math.floor(fy);
      const i1 = Math.min(i + 1, nx - 1), j1 = Math.min(j + 1, ny - 1);
      const tx = fx - i, ty = fy - j;
      const k00 = j * nx + i, k10 = j * nx + i1, k01 = j1 * nx + i, k11 = j1 * nx + i1;
      const u = (1 - tx) * (1 - ty) * flow.vx[k00] + tx * (1 - ty) * flow.vx[k10]
              + (1 - tx) * ty * flow.vx[k01] + tx * ty * flow.vx[k11];
      const v = (1 - tx) * (1 - ty) * flow.vy[k00] + tx * (1 - ty) * flow.vy[k10]
              + (1 - tx) * ty * flow.vy[k01] + tx * ty * flow.vy[k11];
      return [u, v];
    }

    function inPoly(poly, x, y) {
      let n = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
        const hit = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi);
        if (hit) n = !n;
      }
      return n;
    }

    function seedOne(flow, meta, body) {
      const x0 = (meta && meta.x0 != null) ? meta.x0 : -1.80;
      let x = x0 + 0.04 + Math.random() * 0.08;
      let y = 0.06 + Math.random() * 1.7;
      let tries = 0;
      while (body && inPoly(body, x, y) && tries++ < 6) y = 0.06 + Math.random() * 1.7;
      return { x, y, trail: [] };
    }

    function pathPoly(poly, toS, close) {
      ctx.beginPath();
      poly.forEach(([x, y], n) => {
        const p = toS(x, y);
        n ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
      });
      if (close !== false) ctx.closePath();
    }

    function wheelCenter(toS, ax) {
      const c = toS(ax, WHEEL_R);
      const r = Math.abs(toS(ax + WHEEL_R, WHEEL_R)[0] - c[0]);
      const rWell = Math.abs(toS(ax + WELL_R, WHEEL_R)[0] - c[0]);
      return { c, r, rWell };
    }

    function drawCar(toS, s, dpr) {
      const upper = upperBody(s.h);
      const body = closedBody(s.h, s.splitterM, s.wingM, s.diffuserM);
      const glass = glassPoly(s.h);

      pathPoly(body, toS);
      ctx.fillStyle = "#38414c";
      ctx.fill();

      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      AXLES.forEach((ax) => {
        const { c, rWell } = wheelCenter(toS, ax);
        ctx.beginPath();
        ctx.arc(c[0], c[1], rWell, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();

      ctx.beginPath();
      const g0 = toS(-0.6, 0), g1 = toS(5.2, 0);
      ctx.moveTo(g0[0], g0[1]); ctx.lineTo(g1[0], g1[1]);
      ctx.strokeStyle = "#2a3340";
      ctx.lineWidth = 1.2 * dpr;
      ctx.stroke();

      pathPoly(upper, toS, false);
      ctx.strokeStyle = "#e31937";
      ctx.lineWidth = 2.4 * dpr;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();

      AXLES.forEach((ax) => {
        const { c, r, rWell } = wheelCenter(toS, ax);
        ctx.beginPath();
        ctx.arc(c[0], c[1], rWell, Math.PI * 1.08, Math.PI * 1.92, true);
        ctx.strokeStyle = "#e31937";
        ctx.lineWidth = 2.4 * dpr;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(c[0], c[1], r, 0, Math.PI * 2);
        ctx.fillStyle = "#0d1014";
        ctx.fill();
        ctx.strokeStyle = "#8a93a2";
        ctx.lineWidth = 2 * dpr;
        ctx.stroke();

        ctx.save();
        ctx.translate(c[0], c[1]);
        ctx.fillStyle = "#2e3540";
        for (let k = 0; k < 5; k++) {
          ctx.rotate((Math.PI * 2) / 5);
          ctx.beginPath();
          ctx.ellipse(0, -r * 0.36, r * 0.08, r * 0.30, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        ctx.beginPath();
        ctx.arc(c[0], c[1], r * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = "#4a5360";
        ctx.fill();
      });

      pathPoly(glass, toS);
      ctx.fillStyle = "rgba(120, 148, 170, 0.42)";
      ctx.fill();

      const dy = s.h - STOCK_H;
      pathPoly([[1.50, 0.92 + dy], [1.62, 0.97 + dy], [1.64, 0.90 + dy], [1.52, 0.86 + dy]], toS);
      ctx.fillStyle = "#1c222a";
      ctx.fill();
      ctx.strokeStyle = "#e31937";
      ctx.lineWidth = 1.2 * dpr;
      ctx.stroke();
    }

    function frame() {
      const dpr = devicePixelRatio || 1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const s = currentSetup();
      const body = closedBody(s.h, s.splitterM, s.wingM, s.diffuserM);
      const toS = worldToScreen();

      if (last && last.flow) {
        const { flow, meta } = last;
        const x0 = (meta && meta.x0 != null) ? meta.x0 : -1.80;
        const x1 = x0 + (flow.nx - 1) * flow.dx;
        const V = Math.max(1, Number($("airspeedMps").value) || 30);
        while (particles.length < N_PARTICLES) particles.push(seedOne(flow, meta, body));
        if (particles.length > N_PARTICLES) particles.length = N_PARTICLES;
        const dt = 0.022 * (V / 30);
        for (const p of particles) {
          const [u, v] = sampleVel(flow, meta, p.x, p.y);
          const spd = Math.hypot(u, v);
          p.trail.push([p.x, p.y]);
          if (p.trail.length > TRAIL) p.trail.shift();
          const inWheel = AXLES.some((ax) => Math.hypot(p.x - ax, p.y - WHEEL_R) < WELL_R);
          if (spd < 0.2 || inPoly(body, p.x, p.y) || inWheel || p.x > x1 - 0.08 || p.y < 0.015 || p.y > 2.0) {
            Object.assign(p, seedOne(flow, meta, body));
            p.trail = [];
            continue;
          }
          p.x += u * dt;
          p.y += v * dt;
        }
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (const p of particles) {
          if (p.trail.length < 3) continue;
          const [u, v] = sampleVel(flow, meta, p.x, p.y);
          const spd = Math.hypot(u, v);
          const t = Math.max(0, Math.min(1, spd / (V * 1.4)));
          ctx.strokeStyle = `hsla(${200 - 70 * t}, 80%, ${58 + 8 * t}%, 0.42)`;
          ctx.lineWidth = (1.15 + 0.6 * t) * dpr;
          ctx.beginPath();
          p.trail.forEach(([x, y], i) => {
            const q = toS(x, y);
            i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
          });
          ctx.stroke();
        }
      }

      drawCar(toS, s, dpr);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function fmt(n, u) {
      if (!Number.isFinite(n)) return "—";
      const a = Math.abs(n);
      const d = a >= 100 ? 0 : a >= 10 ? 1 : 2;
      return n.toFixed(d) + (u || "");
    }
    function scheduleSim() {
      clearTimeout(simTimer);
      simTimer = setTimeout(simulate, 140);
    }
    async function simulate() {
      $("err").textContent = "";
      $("go").disabled = true;
      const body = {
        airspeedMps: Number($("airspeedMps").value),
        rideHeightMm: Number($("rideHeightMm").value),
        splitter: Number($("splitter").value),
        rearWing: Number($("rearWing").value),
        diffuser: Number($("diffuser").value),
      };
      const t0 = performance.now();
      try {
        const res = await fetch("/simulate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        last = data;
        particles = [];
        const f = data.forces;
        $("cd").textContent = fmt(f.cd);
        $("cl").textContent = fmt(f.cl);
        $("dragN").textContent = fmt(f.dragN, " N");
        $("downforceN").textContent = fmt(f.downforceN, " N");
        $("frontN").textContent = fmt(f.frontN, " N");
        $("rearN").textContent = fmt(f.rearN, " N");
        $("balancePct").textContent = fmt(f.balancePct, " %");
        $("ms").textContent = Math.round(performance.now() - t0) + " ms";
      } catch (e) {
        $("err").textContent = String(e);
      } finally {
        $("go").disabled = false;
      }
    }
    $("go").addEventListener("click", simulate);
    simulate();
  </script>
</body>
</html>
